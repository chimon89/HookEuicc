plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.unicorn369.HookEuicc'
    compileSdk 35
    buildToolsVersion '35.0.0'

    signingConfigs {
        release {
            def keystorePath = System.getenv("SIGNING_KEYSTORE_FILE")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "cn.unicorn369.HookEuicc"
        minSdk 28
        targetSdk 35
        versionCode 102
        versionName "1.0.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("SIGNING_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    //implementation 'io.github.libxposed:service:102.0.0-SNAPSHOT'
}